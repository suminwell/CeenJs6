name: CEEN Android Release

on:
  push:
    branches: [ceen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceen-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/ceen'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Test CEEN version rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set CEEN build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ceen_version.py

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and native build tools
        shell: bash
        run: |
          mapfile -t packages < <(python3 - <<'PY'
          from pathlib import Path
          props = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          print('platforms;android-' + props['COMPILE_SDK_VERSION'])
          print('build-tools;36.0.0')
          for module in ('IMAGE_QUANT', 'RAPID_OCR'):
              print('ndk;' + props[module + '_NDK_VERSION'])
              print('cmake;' + props[module + '_CMAKE_VERSION'])
          PY
          )
          sdkmanager "${packages[@]}"

      - name: Restore CEEN release signing key
        env:
          CEEN_SIGNING_KEYSTORE: ${{ secrets.CEEN_SIGNING_KEYSTORE }}
          CEEN_SIGNING_PASSWORD: ${{ secrets.CEEN_SIGNING_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          os.umask(0o077)
          keystore = os.environ['CEEN_SIGNING_KEYSTORE']
          password = os.environ['CEEN_SIGNING_PASSWORD']
          if not keystore or not password:
              raise SystemExit('Missing CEEN_SIGNING_KEYSTORE or CEEN_SIGNING_PASSWORD repository secret')
          def escape(value):
              return ''.join('\\u%04x' % ord(char) for char in value)
          path = Path(os.environ['RUNNER_TEMP']) / 'ceen-release.jks'
          path.write_bytes(base64.b64decode(keystore, validate=True))
          props = {'storeFile': str(path), 'keyAlias': 'ceen', 'storePassword': password, 'keyPassword': password}
          Path('sign.properties').write_text(''.join(f'{key}={escape(value)}\n' for key, value in props.items()))
          PY

      # The runtime APK must be copied to assets before building the main app.
      - name: Build runtime template
        run: bash ./gradlew assembleInrtRelease --no-daemon --max-workers=2 --console=plain

      - name: Build application APKs
        run: bash ./gradlew assembleAppRelease --no-daemon --max-workers=2 --console=plain

      - name: Verify signatures and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            apk="app/build/outputs/apk/app/release/ceenjs6-v${{ steps.version.outputs.version }}-${abi}.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" release/
          done
          cd release
          sha256sum ./*.apk > SHA256SUMS

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: ceen-release-apks
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f sign.properties "$RUNNER_TEMP/ceen-release.jks"

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ceen-release-apks
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.upstream_version }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          CEEN maintenance build from the ceen branch.

          - Version: ${RELEASE_VERSION}
          - Upstream version: ${UPSTREAM_VERSION}
          - Build number: ${GITHUB_RUN_NUMBER}
          - Commit: ${GITHUB_SHA}
          - Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - APKs: arm64-v8a, armeabi-v7a, x86, x86_64, universal
          - SHA-256 checksums: SHA256SUMS

          Package: org.ceenjs.ceenjs6. Signed with the persistent CEEN release key. Later CeenJs6 builds can upgrade this app.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "CEEN ${RELEASE_VERSION}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
